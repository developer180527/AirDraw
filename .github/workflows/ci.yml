# AirDraw CI (docs/ARCHITECTURE.md §9). Stage 1: Rust checks, Linux x86_64 build and smoke
# test. Later stages add macOS, Linux/Windows arm64, Windows x64, Android and iOS.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GODOT_VERSION: 4.7.2-stable

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all --check
        working-directory: rust
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: rust
      - run: cargo test --workspace
        working-directory: rust

  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            godot_zip: linux.x86_64
            godot_bin: linux.x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.godot_bin }}

      # Native tests too: path handling and architecture bugs show up only here.
      - name: Tests
        run: cargo test --workspace
        working-directory: rust
      - name: Build GDExtension (release)
        run: cargo build --release -p airdraw-godot
        working-directory: rust

      # Official editor: AirDraw's engine patches only touch Apple code (§9a).
      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-${{ matrix.godot_bin }}
      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_${{ matrix.godot_zip }}.zip"
          unzip -q godot.zip && rm godot.zip
      - name: Godot path
        run: echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}_${{ matrix.godot_bin }}" >> "$GITHUB_ENV"

      # Software Vulkan (lavapipe) under a virtual X display: the smoke test renders.
      - name: Install display and software Vulkan
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends xvfb mesa-vulkan-drivers libvulkan1 \
            libxcursor1 libxinerama1 libxrandr2 libxi6 libgl1 libfontconfig1

      - name: Import project
        run: timeout 600 "$GODOT" --headless --path app --import 2>&1 | grep -E "ERROR|error" || true
      - name: Smoke test
        run: |
          xvfb-run -a -s "-screen 0 1920x1200x24" timeout 1200 \
            "$GODOT" --path app --rendering-driver vulkan res://tests/draw_smoke_test.tscn > smoke.log 2>&1 || true
          python3 scripts/check_smoke.py smoke.log
      - name: Upload smoke log and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.godot_bin }}
          retention-days: 7
          path: |
            smoke.log
            ~/.local/share/godot/app_userdata/AirDraw/*.png
